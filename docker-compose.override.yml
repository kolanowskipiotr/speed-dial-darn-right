# Development overrides — automatically merged by `docker compose up`.
# Mounts source files into the container so edits are live without rebuilding.
# NOT used in production (install.sh / brew formula use docker-compose.yml only).

services:
  speed-dial:
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/speed-dial.conf:ro
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./css:/usr/share/nginx/html/css:ro
      - ./js:/usr/share/nginx/html/js:ro
      - ./partials:/usr/share/nginx/html/partials:ro
