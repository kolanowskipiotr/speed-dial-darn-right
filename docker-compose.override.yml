# Development overrides — automatically merged by `docker compose up`.
# Mounts source files into the container so edits are live without rebuilding.
# NOT used in production (install.sh / brew formula use docker-compose.yml only).

services:
  speed-dial:
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/speed-dial.conf:ro
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./domain:/usr/share/nginx/html/domain:ro

  uploader:
    environment:
      - GDRIVE_FOLDER_ID=${GDRIVE_FOLDER_ID:-}
      - GDRIVE_SERVICE_ACCOUNT_JSON=${GDRIVE_SERVICE_ACCOUNT_JSON:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
    volumes:
      - ./uploader:/app:rw
      - speed_dial_uploads:/uploads:rw
