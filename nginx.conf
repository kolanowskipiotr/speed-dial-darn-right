server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── Static files ────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Data storage (future use) ────────────────────────────────────
    # When you add a backend, PUT/GET /data/* will be routed here.
    # For now nginx serves any files dropped into /data as static JSON.
    location /data/ {
        alias /data/;
        autoindex off;

        # Allow reading and writing from the browser
        add_header Access-Control-Allow-Origin  "*";
        add_header Access-Control-Allow-Methods "GET, PUT, POST, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type";

        # Handle preflight
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # ── User-uploaded assets (future use) ───────────────────────────
    # ^~ prevents the jpg/png regex location below from taking priority
    location ^~ /uploads/ {
        alias /uploads/;
        autoindex off;
        add_header Access-Control-Allow-Origin "*";
    }

    # ── Security headers ────────────────────────────────────────────
    add_header X-Frame-Options       "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy       "no-referrer-when-downgrade";

    # Broad CORS so the browser page can fetch favicons / page titles
    add_header Access-Control-Allow-Origin "*";

    # ── Cache static assets ─────────────────────────────────────────
    location ~* \.(ico|png|jpg|jpeg|gif|svg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
