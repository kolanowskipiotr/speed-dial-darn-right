server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Disable sendfile so Docker bind-mount changes are served immediately.
    # (sendfile on macOS Docker skips the VFS layer and serves stale data)
    sendfile off;

    # Gzip compression
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── Static files ────────────────────────────────────────────────
    ssi on;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Data storage (future use) ────────────────────────────────────
    # When you add a backend, PUT/GET /data/* will be routed here.
    # For now nginx serves any files dropped into /data as static JSON.
    location /data/ {
        alias /data/;
        autoindex off;

        # Allow reading and writing from the browser
        add_header Access-Control-Allow-Origin  "*";
        add_header Access-Control-Allow-Methods "GET, PUT, POST, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type";

        # Handle preflight
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # ── User-uploaded assets ────────────────────────────────────────
    # ^~ prevents the jpg/png regex location below from taking priority
    location ^~ /uploads/ {
        alias /uploads/;
        autoindex off;
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "no-cache";
    }

    # ── Image upload API (proxy to uploader sidecar) ─────────────────
    location ^~ /api/upload/ {
        client_max_body_size 10m;
        proxy_pass         http://uploader:3001/upload/;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
    }

    # ── Sync API (proxy to uploader sidecar) ───────────────────────
    location ^~ /api/sync {
        client_max_body_size 20m;
        proxy_pass         http://uploader:3001/api/sync;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }

    # ── Security headers ────────────────────────────────────────────
    add_header X-Frame-Options       "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy       "no-referrer-when-downgrade";

    # Broad CORS so the browser page can fetch favicons / page titles
    add_header Access-Control-Allow-Origin "*";

    # ── App icons — never cache (they change between deploys) ───────
    location = /favicon.ico { expires -1; add_header Cache-Control "no-cache"; }
    location = /icon.ico    { expires -1; add_header Cache-Control "no-cache"; }
    location = /icon.svg    { expires -1; add_header Cache-Control "no-cache"; }

    # ── Cache static assets ─────────────────────────────────────────
    location ~* \.(ico|png|jpg|jpeg|gif|svg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
