<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speed Dial</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap');

        :root {
            --bg: #0f1117;
            --surface: #1a1d27;
            --surface2: #222534;
            --surface3: #2a2e42;
            --border: rgba(255,255,255,0.07);
            --border-hover: rgba(255,255,255,0.15);
            --accent: #f0a500;
            --accent2: #e07b00;
            --text: #e8eaf0;
            --text-dim: #8b90a8;
            --text-dimmer: #555a72;
            --danger: #e05555;
            --success: #4caf88;
            --radius: 14px;
            --radius-sm: 8px;
            --shadow: 0 4px 24px rgba(0,0,0,0.4);
            --shadow-hover: 0 8px 32px rgba(0,0,0,0.5);
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 0;
            overflow-x: hidden;
        }

        /* Subtle background texture */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 50% at 20% 10%, rgba(240,165,0,0.04) 0%, transparent 60%),
                radial-gradient(ellipse 60% 40% at 80% 80%, rgba(100,120,255,0.04) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        /* ── HEADER ─────────────────────────────── */
        header {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 28px;
            background: rgba(15,17,23,0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
        }

        .logo {
            font-family: 'DM Mono', monospace;
            font-size: 13px;
            font-weight: 500;
            color: var(--accent);
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Edit toggle switch */
        .edit-toggle {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            user-select: none;
        }

        .edit-toggle-label {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-dim);
            transition: color var(--transition);
            letter-spacing: 0.04em;
        }

        .edit-toggle.active .edit-toggle-label { color: var(--accent); }

        .toggle-track {
            width: 42px; height: 24px;
            background: var(--surface3);
            border-radius: 12px;
            position: relative;
            transition: background var(--transition);
            border: 1px solid var(--border);
        }

        .edit-toggle.active .toggle-track {
            background: var(--accent);
            border-color: var(--accent);
        }

        .toggle-thumb {
            width: 18px; height: 18px;
            background: var(--text-dimmer);
            border-radius: 50%;
            position: absolute;
            top: 2px; left: 2px;
            transition: transform var(--transition), background var(--transition);
        }

        .edit-toggle.active .toggle-thumb {
            transform: translateX(18px);
            background: white;
        }

        .btn-export { display: none; }
        body.edit-mode .btn-export { display: inline-flex; }

        .btn-export {
            padding: 7px 14px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-dim);
            font-size: 12px;
            font-family: 'DM Sans', sans-serif;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition);
            letter-spacing: 0.03em;
        }

        .btn-export:hover {
            background: var(--surface3);
            color: var(--text);
            border-color: var(--border-hover);
        }


        /* ── TABS BAR ────────────────────────────── */
        .tabs-bar {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 36px;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 7px 18px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 100px;
            color: var(--text-dim);
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition);
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .tab-btn:hover { background: var(--surface2); color: var(--text); border-color: var(--border-hover); }

        .tab-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #1a1000;
            font-weight: 600;
        }

        .tab-btn.add-tab-btn {
            background: transparent;
            border-style: dashed;
            border-color: var(--surface3);
            color: var(--text-dimmer);
            display: none;
        }

        body.edit-mode .tab-btn.add-tab-btn { display: flex; }

        .tab-btn.add-tab-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(240,165,0,0.05);
        }

        .tab-edit-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 11px;
            padding: 0 0 0 2px;
            opacity: 0.6;
            display: none;
            line-height: 1;
        }

        .tab-btn.drag-over-tab {
            border-color: var(--accent);
            background: rgba(240,165,0,0.1);
        }

        .tab-edit-btn:hover { opacity: 1; }
        body.edit-mode .tab-btn.active .tab-edit-btn { display: inline; }

        /* ── MAIN ─────────────────────────────────── */
        main {
            position: relative;
            z-index: 1;
            width: 100%;
            padding: 90px 40px 60px;
        }

        /* ── GROUPS ──────────────────────────────── */
        .groups-container { display: flex; flex-direction: column; gap: 36px; }

        .group {
            position: relative;
            transition: opacity var(--transition);
        }

        .group.drag-over > .dials-grid {
            outline: 2px dashed var(--accent);
            outline-offset: 4px;
            border-radius: var(--radius);
        }

        .group-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
            padding: 0 2px;
            position: relative;
        }

        .group-header-line {
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .group-emoji {
            font-size: 22px;
            line-height: 1;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }

        .group-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-dim);
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .group-edit-controls {
            display: none;
            align-items: center;
            gap: 6px;
        }

        body.edit-mode .group-edit-controls { display: flex; }

        .btn-icon {
            width: 28px; height: 28px;
            display: flex; align-items: center; justify-content: center;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-dim);
            font-size: 13px;
            cursor: pointer;
            transition: all var(--transition);
        }

        .btn-icon:hover { background: var(--surface3); color: var(--text); border-color: var(--border-hover); }
        .btn-icon.danger:hover { background: rgba(224,85,85,0.15); color: var(--danger); border-color: rgba(224,85,85,0.3); }
        .btn-icon.success:hover { background: rgba(76,175,136,0.15); color: var(--success); border-color: rgba(76,175,136,0.3); }

        .group-drag-handle {
            display: none;
            cursor: grab;
            color: var(--text-dimmer);
            font-size: 14px;
            padding: 4px;
        }

        body.edit-mode .group-drag-handle { display: flex; align-items: center; }
        .group-drag-handle:active { cursor: grabbing; }

        /* ── DIALS GRID ──────────────────────────── */
        .dials-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 14px;
            transition: all var(--transition);
        }

        .dials-grid .dial-card {
            width: var(--dial-size, 140px);
            flex-shrink: 0;
            flex-grow: 0;
        }

        /* ── DIAL CARD — unified size ────────────────────────────────── */
        .dial-card {
            position: relative;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px 12px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            transition: all var(--transition);
            /* Height is laptop-screen ratio → 4:3 */
            aspect-ratio: 4 / 3;
            overflow: hidden;
        }

        .dial-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.03) 0%, transparent 60%);
            border-radius: var(--radius);
            pointer-events: none;
            z-index: 1;
        }

        body:not(.edit-mode) .dial-card:hover {
            background: var(--surface2);
            border-color: var(--border-hover);
            transform: translateY(-3px);
            box-shadow: var(--shadow-hover);
        }

        body.edit-mode .dial-card { cursor: default; }
        body.edit-mode .dial-card.dragging { opacity: 0.4; cursor: grabbing; }

        /* Icon wrap — scales with card */
        .dial-icon-wrap {
            width: 52%;
            aspect-ratio: 1 / 1;
            border-radius: 14px;
            background: var(--surface2);
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
            transition: all var(--transition);
            position: relative;
            z-index: 2;
        }

        body:not(.edit-mode) .dial-card:hover .dial-icon-wrap {
            background: var(--surface3);
            transform: scale(1.06);
        }

        .dial-icon-wrap img {
            width: 100%; height: 100%;
            object-fit: contain;
            padding: 18%;
        }

        .dial-icon-wrap .dial-emoji {
            font-size: clamp(18px, 2.2vw, 36px);
            line-height: 1;
        }

        /* ── DIAL CARD — screenshot / full-bleed ────────────────────── */
        .dial-card.dial-screenshot {
            padding: 0;
            background: var(--surface2);
            gap: 0;
        }

        .dial-card.dial-screenshot::before { display: none; }

        .dial-screenshot-img {
            position: absolute;
            inset: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            border-radius: var(--radius);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .dial-screenshot-img.loaded { opacity: 1; }

        /* Name gradient overlay for screenshots */
        .dial-card.dial-screenshot .dial-name {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            z-index: 3;
            padding: 22px 8px 7px;
            background: linear-gradient(to top, rgba(0,0,0,0.82) 0%, transparent 100%);
            border-radius: 0 0 var(--radius) var(--radius);
            color: #fff;
            font-size: 11px;
            font-weight: 600;
            text-align: center;
            -webkit-line-clamp: 1;
        }

        body:not(.edit-mode) .dial-card.dial-screenshot:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: var(--shadow-hover);
            border-color: var(--border-hover);
        }

        body:not(.edit-mode) .dial-card.dial-screenshot:hover .dial-screenshot-img {
            filter: brightness(1.08);
        }

        /* Standard name label */
        .dial-name {
            font-size: 11px;
            font-weight: 500;
            color: var(--text);
            text-align: center;
            line-height: 1.4;
            word-break: break-word;
            max-width: 100%;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            position: relative;
            z-index: 2;
        }

        /* Edit overlay on dial */
        .dial-edit-overlay {
            display: none;
            position: absolute;
            inset: 0;
            z-index: 10;
            border-radius: var(--radius);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: rgba(10,12,20,0.55);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            transition: background var(--transition);
            pointer-events: none;
        }

        body.edit-mode .dial-edit-overlay { display: flex; }

        /* Buttons hidden by default, appear on card hover */
        .dial-overlay-btns {
            pointer-events: auto;
            display: flex;
            gap: 6px;
            opacity: 0;
            transform: translateY(4px);
            transition: opacity var(--transition), transform var(--transition);
        }

        body.edit-mode .dial-card:hover .dial-overlay-btns {
            opacity: 1;
            transform: translateY(0);
        }

        body.edit-mode .dial-card:hover .dial-edit-overlay {
            background: rgba(10,12,20,0.78);
        }

        .dial-drag-handle-overlay {
            display: none;
            position: absolute;
            top: 6px; left: 6px;
            z-index: 11;
            color: rgba(255,255,255,0.6);
            font-size: 14px;
            cursor: grab;
            padding: 4px;
            border-radius: 4px;
            background: rgba(255,255,255,0.08);
            line-height: 1;
            pointer-events: auto;
        }

        body.edit-mode .dial-drag-handle-overlay { display: flex; }

        /* Add dial button */
        .dial-card.add-dial-btn {
            border-style: dashed;
            border-color: var(--surface3);
            background: transparent;
            cursor: pointer;
            color: var(--text-dimmer);
            display: none;
            transition: all var(--transition);
        }

        body.edit-mode .dial-card.add-dial-btn { display: flex; }

        .dial-card.add-dial-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(240,165,0,0.05);
        }

        .add-dial-btn .add-icon { font-size: 24px; }
        .add-dial-btn .add-label { font-size: 11px; font-weight: 500; letter-spacing: 0.04em; }

        /* Add group button */
        .add-group-btn {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 24px;
            border: 1px dashed var(--surface3);
            border-radius: var(--radius);
            background: transparent;
            color: var(--text-dimmer);
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition);
            letter-spacing: 0.03em;
        }

        body.edit-mode .add-group-btn { display: flex; }

        .add-group-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(240,165,0,0.05);
        }

        /* ── MODAL ───────────────────────────────── */
        .modal-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 200;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-backdrop.open { display: flex; }

        .modal {
            background: var(--surface);
            border: 1px solid var(--border-hover);
            border-radius: 18px;
            padding: 28px;
            width: 100%;
            max-width: 420px;
            max-height: 92vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            animation: modal-in 0.22s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes modal-in {
            from { opacity: 0; transform: scale(0.95) translateY(8px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .modal-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 22px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group { margin-bottom: 16px; }

        .form-label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-dim);
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin-bottom: 7px;
        }

        .form-input {
            width: 100%;
            padding: 10px 14px;
            background: var(--surface2);
            border: 1px solid var(--border-hover);
            border-radius: var(--radius-sm);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            outline: none;
            transition: border-color var(--transition);
        }

        .form-input:focus { border-color: var(--accent); }
        .form-input::placeholder { color: var(--text-dimmer); }

        .emoji-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .emoji-preview {
            width: 42px; height: 42px;
            background: var(--surface2);
            border: 1px solid var(--border-hover);
            border-radius: var(--radius-sm);
            display: flex; align-items: center; justify-content: center;
            font-size: 22px;
            cursor: pointer;
            transition: all var(--transition);
            flex-shrink: 0;
        }

        .emoji-preview:hover { border-color: var(--accent); }

        .btn-random-emoji {
            padding: 9px 14px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-dim);
            font-family: 'DM Sans', sans-serif;
            font-size: 12px;
            cursor: pointer;
            transition: all var(--transition);
            white-space: nowrap;
        }

        .btn-random-emoji:hover { background: var(--surface3); color: var(--text); }

        /* ── DIAL SIZE SLIDER ─────────────────────── */
        .size-slider-wrap {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .size-slider-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .size-slider {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 4px;
            border-radius: 2px;
            background: var(--surface3);
            outline: none;
            cursor: pointer;
        }

        .size-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            box-shadow: 0 0 0 3px rgba(240,165,0,0.2);
            transition: box-shadow var(--transition);
        }

        .size-slider::-webkit-slider-thumb:hover {
            box-shadow: 0 0 0 5px rgba(240,165,0,0.3);
        }

        .size-slider::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border: none;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
        }

        .size-value {
            font-size: 12px;
            font-weight: 600;
            color: var(--accent);
            min-width: 36px;
            text-align: right;
            font-family: 'DM Mono', monospace;
        }

        .size-labels {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: var(--text-dimmer);
            padding: 0 2px;
        }

        .icon-source-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 6px;
        }

        .icon-source-btn {
            padding: 7px 12px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-dim);
            font-family: 'DM Sans', sans-serif;
            font-size: 12px;
            cursor: pointer;
            transition: all var(--transition);
        }

        .icon-source-btn.active {
            background: rgba(240,165,0,0.12);
            border-color: var(--accent);
            color: var(--accent);
        }

        .icon-source-btn:hover:not(.active) { background: var(--surface3); color: var(--text); }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 24px;
            justify-content: flex-end;
        }

        .btn-primary {
            padding: 10px 22px;
            background: var(--accent);
            border: none;
            border-radius: var(--radius-sm);
            color: #1a1000;
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
            letter-spacing: 0.02em;
        }

        .btn-primary:hover { background: var(--accent2); transform: translateY(-1px); }

        .btn-secondary {
            padding: 10px 18px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-dim);
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition);
        }

        .btn-secondary:hover { background: var(--surface3); color: var(--text); }

        .favicon-picker {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 10px;
            background: var(--surface2);
            border: 1px solid var(--border-hover);
            border-radius: var(--radius-sm);
            min-height: 58px;
            align-items: center;
        }

        .favicon-hint {
            font-size: 12px;
            color: var(--text-dimmer);
            font-style: italic;
        }

        .favicon-tile {
            width: 48px; height: 48px;
            background: var(--surface3);
            border: 2px solid transparent;
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: all var(--transition);
            position: relative;
            flex-shrink: 0;
        }

        .favicon-tile img {
            width: 30px; height: 30px;
            object-fit: contain;
        }

        .favicon-tile:hover {
            border-color: var(--border-hover);
            background: var(--surface);
            transform: scale(1.08);
        }

        .favicon-tile.selected {
            border-color: var(--accent);
            background: rgba(240,165,0,0.1);
            box-shadow: 0 0 0 1px var(--accent);
        }

        .favicon-tile .favicon-check {
            display: none;
            position: absolute;
            top: -5px; right: -5px;
            width: 16px; height: 16px;
            background: var(--accent);
            border-radius: 50%;
            font-size: 10px;
            align-items: center; justify-content: center;
            color: #1a1000;
            font-weight: 700;
        }

        .favicon-tile.selected .favicon-check { display: flex; }

        .favicon-loading {
            font-size: 12px;
            color: var(--text-dimmer);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
        .spinner {
            width: 14px; height: 14px;
            border: 2px solid var(--surface3);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            flex-shrink: 0;
        }
        .emoji-picker {
            display: none;
            flex-direction: column;
            background: var(--surface2);
            border: 1px solid var(--border-hover);
            border-radius: var(--radius-sm);
            height: 300px;
            margin-top: 8px;
            overflow: hidden; /* clip, inner scroll handles it */
        }

        .emoji-picker.open { display: flex; }

        .emoji-search-wrap {
            flex-shrink: 0;
            background: var(--surface2);
            padding: 8px 10px 6px;
            border-bottom: 1px solid var(--border);
            z-index: 2;
        }

        /* Scrollable area below search */
        .emoji-scroll-area {
            flex: 1;
            overflow-y: scroll; /* always show scrollbar */
            overscroll-behavior: contain;
        }

        /* Always-visible scrollbar */
        .emoji-scroll-area::-webkit-scrollbar { width: 7px; }
        .emoji-scroll-area::-webkit-scrollbar-track { background: var(--surface3); border-radius: 4px; }
        .emoji-scroll-area::-webkit-scrollbar-thumb { background: #555a72; border-radius: 4px; }
        .emoji-scroll-area::-webkit-scrollbar-thumb:hover { background: #7b80a0; }

        .emoji-search {
            width: 100%;
            padding: 6px 10px;
            background: var(--surface3);
            border: 1px solid var(--border-hover);
            border-radius: 6px;
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 12px;
            outline: none;
        }

        .emoji-search:focus { border-color: var(--accent); }
        .emoji-search::placeholder { color: var(--text-dimmer); }

        .emoji-category {
            padding: 0 6px 6px;
        }

        .emoji-category-label {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-dimmer);
            padding: 8px 4px 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .emoji-category-label::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .emoji-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 2px;
        }

        .emoji-opt {
            font-size: 20px;
            cursor: pointer;
            padding: 5px;
            border-radius: 6px;
            transition: background var(--transition);
            line-height: 1;
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .emoji-opt:hover { background: var(--surface3); }

        .emoji-no-results {
            text-align: center;
            padding: 20px;
            color: var(--text-dimmer);
            font-size: 13px;
        }



        /* Import modal */
        .import-textarea {
            width: 100%;
            height: 140px;
            padding: 10px 14px;
            background: var(--surface2);
            border: 1px solid var(--border-hover);
            border-radius: var(--radius-sm);
            color: var(--text);
            font-family: 'DM Mono', monospace;
            font-size: 12px;
            outline: none;
            resize: vertical;
            transition: border-color var(--transition);
        }

        .import-textarea:focus { border-color: var(--accent); }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-dimmer);
        }

        .empty-state .empty-icon { font-size: 48px; margin-bottom: 16px; }
        .empty-state p { font-size: 14px; line-height: 1.6; }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--surface2);
            border: 1px solid var(--border-hover);
            border-radius: 100px;
            padding: 10px 20px;
            font-size: 13px;
            color: var(--text);
            box-shadow: var(--shadow);
            z-index: 999;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
            white-space: nowrap;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast-undo {
            margin-left: 12px;
            padding: 3px 10px;
            background: var(--accent);
            border: none;
            border-radius: 100px;
            color: #1a1000;
            font-family: 'DM Sans', sans-serif;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            pointer-events: all;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 3px; }
    </style>
</head>

<!-- HEADER -->
<header>
    <div class="logo">⚡ Speed Dial</div>
    <div class="header-actions">
        <button class="btn-export" onclick="exportData()">Export JSON</button>
        <button class="btn-export" onclick="openImportModal()">Import</button>
        <div class="edit-toggle" id="editToggle" onclick="toggleEditMode()">
            <span class="edit-toggle-label" id="editLabel">Edit</span>
            <div class="toggle-track">
                <div class="toggle-thumb"></div>
            </div>
        </div>
    </div>
</header>

<!-- MAIN -->
<main>
    <div class="tabs-bar" id="tabsBar"></div>
    <div class="groups-container" id="groupsContainer"></div>
    <button class="add-group-btn" id="addGroupBtn" onclick="openGroupModal()">
        <span style="font-size:18px">＋</span> Add Group
    </button>
    <div class="empty-state" id="emptyState" style="display:none">
        <div class="empty-icon">🚀</div>
        <p>No speed dials yet.<br>Toggle <strong>Edit</strong> mode to add tabs, groups and dials.</p>
    </div>
</main>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- MODAL: Add/Edit Dial -->
<div class="modal-backdrop" id="dialModal">
    <div class="modal">
        <div class="modal-title"><span id="dialModalTitle">Add Dial</span></div>
        <div class="form-group">
            <label class="form-label" style="display:flex;align-items:center;justify-content:space-between;">
                Name
                <span id="titleFetchStatus" style="font-size:11px;color:var(--text-dimmer);font-weight:400;letter-spacing:0;text-transform:none;"></span>
            </label>
            <input type="text" class="form-input" id="dialName" placeholder="Auto-fetched from URL…">
        </div>
        <div class="form-group">
            <label class="form-label">URL</label>
            <input type="text" class="form-input" id="dialUrl" placeholder="https://..." oninput="onUrlInput()" onblur="fetchPageTitle()">
        </div>
        <div class="form-group">
            <label class="form-label">Icon</label>
            <div class="icon-source-row">
                <button class="icon-source-btn active" id="iconSrcFavicon" onclick="setIconSrc('favicon')">Auto Favicon</button>
                <button class="icon-source-btn" id="iconSrcEmoji" onclick="setIconSrc('emoji')">Emoji</button>
                <button class="icon-source-btn" id="iconSrcCustom" onclick="setIconSrc('custom')">Custom URL</button>
            </div>
        </div>
        <!-- Favicon picker panel -->
        <div class="form-group" id="faviconPickerGroup">
            <div class="favicon-picker" id="faviconPicker">
                <span class="favicon-hint" id="faviconHint">Enter a URL above to load icons</span>
            </div>
        </div>
        <div class="form-group" id="emojiPickerGroup" style="display:none">
            <div class="emoji-row">
                <div class="emoji-preview" id="dialEmojiPreview" onclick="toggleEmojiPicker('dial')">😀</div>
                <button class="btn-random-emoji" onclick="randomEmoji('dial')">🎲 Random</button>
                <span style="font-size:12px; color: var(--text-dimmer);">Click emoji to pick</span>
            </div>
            <div class="emoji-picker" id="dialEmojiPicker"></div>
        </div>
        <div class="form-group" id="customIconGroup" style="display:none">
            <input type="text" class="form-input" id="dialCustomIcon" placeholder="https://example.com/icon.png" oninput="previewCustomIcon()">
            <div id="customIconPreview" style="margin-top:10px; display:none; align-items:center; gap:10px; flex-wrap:wrap;"></div>
        </div>
        <div class="modal-actions">
            <button class="btn-secondary" onclick="closeModal('dialModal')">Cancel</button>
            <button class="btn-primary" onclick="saveDial()">Save</button>
        </div>
    </div>
</div>


<!-- MODAL: Add/Edit Tab -->
<div class="modal-backdrop" id="tabModal">
    <div class="modal" style="max-width:360px">
        <div class="modal-title"><span id="tabModalTitle">Add Tab</span></div>
        <div class="form-group">
            <label class="form-label">Tab Name</label>
            <input type="text" class="form-input" id="tabName" placeholder="e.g. Work, Personal...">
        </div>
        <div class="form-group">
            <label class="form-label">Emoji</label>
            <div class="emoji-row">
                <div class="emoji-preview" id="tabEmojiPreview" onclick="toggleEmojiPicker('tab')">🗂</div>

                <span style="font-size:12px; color: var(--text-dimmer);">Click to pick</span>
            </div>
            <div class="emoji-picker" id="tabEmojiPicker"></div>
        </div>
        <div class="modal-actions">
            <button class="btn-secondary" onclick="closeModal('tabModal')">Cancel</button>
            <button class="btn-primary" id="tabDeleteBtn" style="background:var(--danger);color:#fff;display:none" onclick="closeModal('tabModal');deleteTab(editingTabId)">Delete Tab</button>
            <button class="btn-primary" onclick="saveTab()">Save</button>
        </div>
    </div>
</div>

<!-- MODAL: Add/Edit Group -->
<div class="modal-backdrop" id="groupModal">
    <div class="modal">
        <div class="modal-title"><span id="groupModalTitle">Add Group</span></div>

            <label class="form-label">Group Name</label>

        </div>
        <div class="form-group">
            <label class="form-label">Dial Size <span class="size-value" id="groupSizeValue">140px</span></label>
            <div class="size-slider-wrap">
                <div class="size-slider-row">
                    <span style="font-size:14px">🔲</span>
                    <input type="range" class="size-slider" id="groupSizeSlider"
                           min="60" max="400" step="10" value="140"
                           oninput="setGroupSize(+this.value)">

                </div>
                <div class="size-labels">
                    <span>Tiny</span><span>Small</span><span>Medium</span><span>Large</span><span>Huge</span>
                </div>
            </div>
        </div>
        <div class="form-group">
            <label class="form-label">Emoji</label>
            <div class="emoji-row">
                <div class="emoji-preview" id="groupEmojiPreview" onclick="toggleEmojiPicker('group')">📁</div>
                <button class="btn-random-emoji" onclick="randomEmoji('group')">🎲 Random</button>
                <span style="font-size:12px; color: var(--text-dimmer);">Click to pick</span>
            </div>
            <div class="emoji-picker" id="groupEmojiPicker"></div>
        </div>
        <div class="modal-actions">
            <button class="btn-secondary" onclick="closeModal('groupModal')">Cancel</button>
            <button class="btn-primary" onclick="saveGroup()">Save</button>
        </div>
    </div>
</div>

<!-- MODAL: Confirm Delete -->
<div class="modal-backdrop" id="confirmModal">
    <div class="modal" style="max-width:360px">
        <div class="modal-title" id="confirmTitle">Are you sure?</div>
        <p id="confirmMessage" style="font-size:13px; color:var(--text-dim); line-height:1.6; margin-bottom:4px;"></p>
        <div class="modal-actions">
            <button class="btn-secondary" onclick="closeModal('confirmModal')">Cancel</button>
            <button class="btn-primary" id="confirmOkBtn" style="background:var(--danger);color:#fff;">Delete</button>
        </div>
    </div>
</div>

<div class="modal-backdrop" id="importModal">
    <div class="modal">
        <div class="modal-title">Import JSON</div>
        <div class="form-group">
            <label class="form-label">Paste JSON data</label>
            <textarea class="import-textarea" id="importData" placeholder='{"groups": [...]}'></textarea>
        </div>
        <div class="modal-actions">
            <button class="btn-secondary" onclick="closeModal('importModal')">Cancel</button>
            <button class="btn-primary" onclick="importData()">Import</button>
        </div>
    </div>
</div>

    // ─── DATA PERSISTENCE ──────────────────────────────────────────
    function loadData() {
        try {
            const raw = localStorage.getItem('speedDial_v2');
            if (raw) data = JSON.parse(raw);
        } catch(e) { data = { tabs: [] }; }

        // Migrate old format: { groups: [...] } → { tabs: [{ id, name, groups }] }
        if (data.groups && !data.tabs) {
            data = { tabs: [{ id: uid(), name: 'Home', groups: data.groups }] };
            saveData();
        }
        if (!data.tabs) data = { tabs: [] };
        if (!data.tabs.length) {
            data.tabs.push({ id: uid(), name: 'Home', groups: [] });
            saveData();
        }
        activeTabId = data.tabs[0].id;
    }

    function getActiveTab() {
        return data.tabs.find(t => t.id === activeTabId) || data.tabs[0];
    }

    function saveData() {
        localStorage.setItem('speedDial_v2', JSON.stringify(data));
    }

    // ─── UTILS ─────────────────────────────────────────────────────
    function uid() {
        return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    }

    function pickRandomEmoji(list) {
        return list[Math.floor(Math.random() * list.length)];
    }

    function getDomain(url) {
        try {
            return new URL(url).hostname;
        } catch { return ''; }
    }

    // Returns ordered favicon URL candidates for a domain
    function getFaviconCandidates(url) {
        const domain = getDomain(url);
        if (!domain) return [];
        const bare = domain.replace(/^www\./, '');
        return [
            `https://icons.duckduckgo.com/ip3/${domain}.ico`,
            `https://www.google.com/s2/favicons?domain=${domain}&sz=64`,
            `https://${domain}/favicon.ico`,
            `https://${domain}/apple-touch-icon.png`,
            `https://${bare}/favicon.ico`,
        ];
    }

    // Directly chain onerror on the DOM img element through each candidate
    function attachFavicon(imgEl, dialUrl, fallbackEmoji) {
        const candidates = getFaviconCandidates(dialUrl);
        if (!candidates.length) { showEmojiInstead(imgEl, fallbackEmoji); return; }
        let idx = 0;
        function tryNext() {
            if (!document.body.contains(imgEl)) return;
            if (idx >= candidates.length) { showEmojiInstead(imgEl, fallbackEmoji); return; }
            imgEl.onerror = () => { imgEl.onerror = null; imgEl.onload = null; tryNext(); };
            imgEl.onload = null;
            imgEl.src = candidates[idx++];
        }
        tryNext();
    }

    function showEmojiInstead(imgEl, emoji) {
        const wrap = imgEl.parentElement;
        if (wrap) wrap.innerHTML = `<span class="dial-emoji">${emoji || '🌐'}</span>`;
    }

    let toastTimer = null;

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.innerHTML = `<span>${msg}</span>`;
        t.classList.add('show');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
    }

    function showToastUndo(msg, backup) {
        const t = document.getElementById('toast');
        t.innerHTML = `<span>${msg}</span><button class="toast-undo" onclick="undoDelete('${encodeURIComponent(backup)}')">Undo</button>`;
        t.classList.add('show');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => t.classList.remove('show'), 4000);
    }

    function undoDelete(encodedBackup) {
        try {
            data = JSON.parse(decodeURIComponent(encodedBackup));
            saveData(); render();
            showToast('↩️ Restored');
        } catch(e) { showToast('❌ Could not undo'); }
    }

    // ─── RENDER ────────────────────────────────────────────────────
    function renderTabs() {
        const bar = document.getElementById('tabsBar');
        bar.innerHTML = '';
        let tabDragSrc = null;

        data.tabs.forEach(tab => {
            const btn = document.createElement('button');
            btn.dataset.tabId = tab.id;
            btn.className = 'tab-btn' + (tab.id === activeTabId ? ' active' : '');
            btn.innerHTML = `<span>${tab.emoji || '🗂'}</span><span>${tab.name}</span>`;
            btn.onclick = () => { activeTabId = tab.id; render(); };

            // Edit button
            const editBtn = document.createElement('button');
            editBtn.className = 'tab-edit-btn';
            editBtn.title = 'Edit / delete tab';
            editBtn.textContent = '✏️';
            editBtn.onclick = (e) => { e.stopPropagation(); openTabModal(tab.id); };
            btn.appendChild(editBtn);

            // Drag to reorder (edit mode only)
            btn.draggable = editMode;
            btn.addEventListener('dragstart', e => {
                if (!editMode) { e.preventDefault(); return; }
                tabDragSrc = tab.id;
                e.dataTransfer.effectAllowed = 'move';
                btn.classList.add('dragging');
            });
            btn.addEventListener('dragend', () => btn.classList.remove('dragging'));
            btn.addEventListener('dragover', e => {
                if (!tabDragSrc || tabDragSrc === tab.id) return;
                e.preventDefault();
                btn.classList.add('drag-over-tab');
            });
            btn.addEventListener('dragleave', () => btn.classList.remove('drag-over-tab'));
            btn.addEventListener('drop', e => {
                e.preventDefault();
                btn.classList.remove('drag-over-tab');
                if (!tabDragSrc || tabDragSrc === tab.id) return;
                const srcIdx = data.tabs.findIndex(t => t.id === tabDragSrc);
                const tgtIdx = data.tabs.findIndex(t => t.id === tab.id);
                if (srcIdx === -1 || tgtIdx === -1) return;
                const [moved] = data.tabs.splice(srcIdx, 1);
                data.tabs.splice(tgtIdx, 0, moved);
                tabDragSrc = null;
                saveData(); renderTabs();
            });

            bar.appendChild(btn);
        });

        // Add tab button
        const addBtn = document.createElement('button');
        addBtn.className = 'tab-btn add-tab-btn';
        addBtn.innerHTML = '＋ Tab';
        addBtn.onclick = () => openTabModal(null);
        bar.appendChild(addBtn);
    }

    function render() {
        renderTabs();
        const container = document.getElementById('groupsContainer');
        const empty = document.getElementById('emptyState');
        container.innerHTML = '';

        const tab = getActiveTab();
        const groups = tab ? tab.groups : [];

        document.getElementById('addGroupBtn').style.display = '';  // let CSS control via body.edit-mode

        if (!groups.length) {
            empty.style.display = 'block';
            return;
        }
        empty.style.display = 'none';

        groups.forEach((group, gi) => {
            const groupEl = document.createElement('div');
            groupEl.className = 'group';
            groupEl.dataset.id = group.id;
            groupEl.draggable = false;

            // Group header
            const header = document.createElement('div');
            header.className = 'group-header';

            const handle = document.createElement('div');
            handle.className = 'group-drag-handle';
            handle.innerHTML = '⠿';
            handle.title = 'Drag to reorder group';
            handle.addEventListener('mousedown', () => { groupEl.draggable = true; });
            handle.addEventListener('touchstart', () => { groupEl.draggable = true; }, {passive:true});
            groupEl.addEventListener('dragend', () => { groupEl.draggable = false; });

            const emojiSpan = document.createElement('span');
            emojiSpan.className = 'group-emoji';
            emojiSpan.textContent = group.emoji;

            const nameSpan = document.createElement('span');
            nameSpan.className = 'group-name';
            nameSpan.textContent = group.name;

            header.appendChild(handle);
            header.appendChild(emojiSpan);
            header.appendChild(nameSpan);

            const line = document.createElement('div');
            line.className = 'group-header-line';
            header.appendChild(line);

            // Group controls
            const controls = document.createElement('div');
            controls.className = 'group-edit-controls';
            controls.innerHTML = `
      <button class="btn-icon" title="Move up" onclick="moveGroup('${group.id}', -1)">↑</button>
      <button class="btn-icon" title="Move down" onclick="moveGroup('${group.id}', 1)">↓</button>
      <button class="btn-icon" title="Edit group" onclick="openGroupModal('${group.id}')">✏️</button>
      <button class="btn-icon danger" title="Delete group" onclick="deleteGroup('${group.id}')">🗑</button>
    `;
            header.appendChild(controls);
            groupEl.appendChild(header);

            // Dials grid
            const grid = document.createElement('div');
            grid.className = 'dials-grid';
            grid.dataset.groupId = group.id;
            grid.style.setProperty('--dial-size', (group.dialSize || 140) + 'px');

            group.dials.forEach((dial, di) => {
                grid.appendChild(makeDialCard(dial, group.id, gi, di));
            });

            // Add dial button
            const addBtn = document.createElement('div');
            addBtn.className = 'dial-card add-dial-btn';
            addBtn.innerHTML = `<span class="add-icon">＋</span><span class="add-label">Add Dial</span>`;
            addBtn.onclick = () => openDialModal(null, group.id);
            grid.appendChild(addBtn);

            groupEl.appendChild(grid);

            // Group drag events
            groupEl.addEventListener('dragstart', e => onGroupDragStart(e, group.id));
            groupEl.addEventListener('dragover', e => onGroupDragOver(e, group.id));
            groupEl.addEventListener('drop', e => onGroupDrop(e, group.id));
            groupEl.addEventListener('dragleave', e => groupEl.classList.remove('drag-over'));

            container.appendChild(groupEl);
        });
    }

    function makeDialCard(dial, groupId, gi, di) {
        const card = document.createElement('div');
        card.dataset.id = dial.id;
        card.dataset.groupId = groupId;

        const isScreenshot = dial.iconType === 'custom' && dial.icon;

        if (isScreenshot) {
            // ── Full-bleed screenshot card ────────────────────────────────
            card.className = 'dial-card dial-screenshot';

            const img = document.createElement('img');
            img.className = 'dial-screenshot-img';
            img.alt = '';
            img.src = dial.icon;
            img.onload  = () => img.classList.add('loaded');
            img.onerror = () => {
                // fallback to emoji if image fails
                card.className = 'dial-card';
                img.remove();
                const wrap = document.createElement('div');
                wrap.className = 'dial-icon-wrap';
                wrap.innerHTML = `<span class="dial-emoji">${dial.emoji || '🌐'}</span>`;
                card.insertBefore(wrap, card.firstChild);
            };
            card.appendChild(img);

        } else {
            // ── Standard card (emoji / favicon) ──────────────────────────
            card.className = 'dial-card';

            const iconWrap = document.createElement('div');
            iconWrap.className = 'dial-icon-wrap';

            if (dial.iconType === 'emoji' || !dial.iconType) {
                const em = document.createElement('span');
                em.className = 'dial-emoji';
                em.textContent = dial.emoji || '🌐';
                iconWrap.appendChild(em);
            } else {
                // favicon
                const img = document.createElement('img');
                img.alt = '';
                img.style.cssText = 'opacity:0;transition:opacity 0.2s';
                img.onload = () => { img.style.opacity = '1'; };
                iconWrap.appendChild(img);
                if (dial.icon) {
                    img.onerror = () => attachFavicon(img, dial.url, dial.emoji || '🌐');
                    img.src = dial.icon;
                } else {
                    attachFavicon(img, dial.url, dial.emoji || '🌐');
                }
            }
            card.appendChild(iconWrap);
        }

        // Name label (both types)
        const name = document.createElement('div');
        name.className = 'dial-name';
        name.textContent = dial.name;
        card.appendChild(name);

        // Edit overlay
        const overlay = document.createElement('div');
        overlay.className = 'dial-edit-overlay';
        overlay.innerHTML = `
    <div class="dial-overlay-btns">
      <button class="btn-icon" title="Move left" onclick="moveDial('${groupId}','${dial.id}',-1)">←</button>
      <button class="btn-icon" title="Edit" onclick="openDialModal('${dial.id}','${groupId}')">✏️</button>
      <button class="btn-icon danger" title="Delete" onclick="deleteDial('${groupId}','${dial.id}')">🗑</button>
      <button class="btn-icon" title="Move right" onclick="moveDial('${groupId}','${dial.id}',1)">→</button>
    </div>
  `;

        // Drag handle overlay
        const dragHandle = document.createElement('div');
        dragHandle.className = 'dial-drag-handle-overlay';
        dragHandle.innerHTML = '⠿';
        dragHandle.title = 'Drag to reorder';
        // Set draggable immediately if already in edit mode; keep in sync via toggleEditMode
        card.draggable = editMode;
        card.addEventListener('dragend', () => { card.classList.remove('dragging'); });

        card.appendChild(dragHandle);
        card.appendChild(overlay);

        // Click to open (only in non-edit mode)
        card.addEventListener('click', e => {
            if (editMode) return;
            if (e.target.closest('.dial-edit-overlay') || e.target.closest('.dial-drag-handle-overlay')) return;
            window.open(dial.url, '_blank');
        });

        // Dial drag events
        card.addEventListener('dragstart', e => onDialDragStart(e, groupId, dial.id));
        card.addEventListener('dragover', e => onDialDragOver(e, groupId, dial.id));
        card.addEventListener('drop', e => onDialDrop(e, groupId, dial.id));

        return card;
    }

    function escHtml(str) {
        return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    // ─── DRAG & DROP: DIALS ─────────────────────────────────────────
    function onDialDragStart(e, groupId, dialId) {
        e.stopPropagation(); // prevent group dragstart handler from cancelling this
        dragSrcType = 'dial';
        dragSrcGroupId = groupId;
        dragSrcDialId = dialId;
        e.dataTransfer.effectAllowed = 'move';
        const card = e.currentTarget;
        card.classList.add('dragging');
    }

    function onDialDragOver(e, groupId, dialId) {
        if (dragSrcType !== 'dial') return;
        e.preventDefault();
        e.stopPropagation();
        e.dataTransfer.dropEffect = 'move';
    }

    function onDialDrop(e, targetGroupId, targetDialId) {
        if (dragSrcType !== 'dial') return;
        e.preventDefault();
        e.stopPropagation();
        if (dragSrcGroupId === targetGroupId && dragSrcDialId === targetDialId) return;

        const groups = getActiveTab().groups;
        const srcGroup = groups.find(g => g.id === dragSrcGroupId);
        const tgtGroup = groups.find(g => g.id === targetGroupId);
        if (!srcGroup || !tgtGroup) return;

        const srcIdx = srcGroup.dials.findIndex(d => d.id === dragSrcDialId);
        const tgtIdx = tgtGroup.dials.findIndex(d => d.id === targetDialId);
        if (srcIdx === -1) return;

        const [dial] = srcGroup.dials.splice(srcIdx, 1);
        if (dragSrcGroupId === targetGroupId) {
            srcGroup.dials.splice(tgtIdx, 0, dial);
        } else {
            tgtGroup.dials.splice(tgtIdx === -1 ? tgtGroup.dials.length : tgtIdx, 0, dial);
        }

        saveData(); render();
    }

    // ─── DRAG & DROP: GROUPS ────────────────────────────────────────
    function onGroupDragStart(e, groupId) {
        if (!e.currentTarget.draggable) { e.preventDefault(); return; }
        dragSrcType = 'group';
        dragSrcGroupId = groupId;
        e.dataTransfer.effectAllowed = 'move';
    }

    function onGroupDragOver(e, groupId) {
        if (dragSrcType !== 'group' || groupId === dragSrcGroupId) return;
        e.preventDefault();
        e.currentTarget.classList.add('drag-over');
    }

    function onGroupDrop(e, targetGroupId) {
        if (dragSrcType !== 'group') return;
        e.preventDefault();
        e.currentTarget.classList.remove('drag-over');
        if (dragSrcGroupId === targetGroupId) return;

        const groups = getActiveTab().groups;
        const srcIdx = groups.findIndex(g => g.id === dragSrcGroupId);
        const tgtIdx = groups.findIndex(g => g.id === targetGroupId);
        if (srcIdx === -1 || tgtIdx === -1) return;

        const [g] = groups.splice(srcIdx, 1);
        groups.splice(tgtIdx, 0, g);

        saveData(); render();
    }

    async function fetchPageTitle() {
        const urlRaw = document.getElementById('dialUrl').value.trim();
        const nameField = document.getElementById('dialName');
        const status = document.getElementById('titleFetchStatus');
        if (!urlRaw || nameField.value.trim()) return;

        let url = urlRaw;
        if (!/^https?:\/\//i.test(url)) url = 'https://' + url;

        status.textContent = '⏳ Fetching title…';
        try {
            const resp = await fetch(url, { signal: AbortSignal.timeout(6000) });
            const text = await resp.text();
            const match = text.match(/<title[^>]*>([^<]{1,120})<\/title>/i);
            if (match?.[1]) {
                nameField.value = match[1].replace(/\s+/g, ' ').trim();
                status.textContent = '✅ Title fetched';
                setTimeout(() => { status.textContent = ''; }, 2000);
            } else {
                status.textContent = '⚠️ No title found';
            }
        } catch {
            status.textContent = '⚠️ Could not fetch';
        }
    }

    function saveDial() {
        const nameField = document.getElementById('dialName');
        const name = nameField.value.trim();
        let url = document.getElementById('dialUrl').value.trim();
        if (!url) { showToast('⚠️ Please enter a URL'); return; }
        if (!/^https?:\/\//i.test(url)) url = 'https://' + url;

        if (!name) {
            const status = document.getElementById('titleFetchStatus');
            status.textContent = '⏳ Fetching title…';
            fetch(url, { signal: AbortSignal.timeout(6000) })
                .then(r => r.text())
                .then(text => {
                    const match = text.match(/<title[^>]*>([^<]{1,120})<\/title>/i);
                    nameField.value = match?.[1]?.replace(/\s+/g, ' ').trim() || getDomain(url);
                    status.textContent = '';
                    _doSaveDial();
                })
                .catch(() => { nameField.value = getDomain(url); status.textContent = ''; _doSaveDial(); });
            return;
        }
        _doSaveDial();
    }

    function _doSaveDial() {
        const name = document.getElementById('dialName').value.trim() || 'Untitled';
        let url = document.getElementById('dialUrl').value.trim();
        if (!/^https?:\/\//i.test(url)) url = 'https://' + url;

        let icon, iconType;
        if (currentIconSrc === 'favicon') {
            icon = selectedFaviconUrl || '';
            iconType = 'favicon';
        } else if (currentIconSrc === 'custom') {
            icon = document.getElementById('dialCustomIcon').value.trim();
            iconType = 'custom';
        } else {
            icon = currentDialEmoji;
            iconType = 'emoji';
        }

        if (editingDialId) {
            const group = getActiveTab().groups.find(g => g.id === editingDialGroupId);
            const dial = group?.dials.find(d => d.id === editingDialId);
            if (dial) { dial.name = name; dial.url = url; dial.icon = icon; dial.iconType = iconType; dial.emoji = currentDialEmoji; }
        } else {
            const group = getActiveTab().groups.find(g => g.id === editingDialGroupId);
            if (group) {
                group.dials.push({ id: uid(), name, url, icon, iconType, emoji: currentDialEmoji });
            }
        }

        saveData(); render();
        closeModal('dialModal');
    }

    // ─── FAVICON PICKER ─────────────────────────────────────────────
    function loadFaviconOptions(rawUrl) {
        let url = rawUrl.trim();
        if (!url) return;
        if (!/^https?:\/\//i.test(url)) url = 'https://' + url;

        const picker = document.getElementById('faviconPicker');
        picker.innerHTML = '<div class="favicon-loading"><div class="spinner"></div><span>Loading icons…</span></div>';
        selectedFaviconUrl = '';

        const domain = getDomain(url);
        const bare = domain.replace(/^www\./, '');

        const candidates = [...new Set([
            `https://icons.duckduckgo.com/ip3/${domain}.ico`,
            `https://www.google.com/s2/favicons?domain=${domain}&sz=128`,
            `https://www.google.com/s2/favicons?domain=${domain}&sz=64`,
            `https://${domain}/favicon.ico`,
            `https://${domain}/favicon.png`,
            `https://${domain}/apple-touch-icon.png`,
            `https://${bare}/favicon.ico`,
        ])];

        const found = [];
        let pending = candidates.length;

        const done = () => {
            pending--;
            if (pending === 0) renderFaviconTiles(found, picker);
        };

        candidates.forEach(src => {
            const img = new Image();
            let settled = false;
            const settle = (ok) => {
                if (settled) return; settled = true;
                clearTimeout(timer);
                if (ok && !found.includes(src)) found.push(src);
                done();
            };
            img.onload = () => settle(true);
            img.onerror = () => settle(false);
            const timer = setTimeout(() => settle(false), 4000);
            img.src = src;
        });
    }

    function renderFaviconTiles(found, picker) {
        picker.innerHTML = '';

        if (!found.length) {
            picker.innerHTML = '<span class="favicon-hint">No icons found — try Emoji or Custom URL</span>';
            return;
        }

        // Deduplicate visually identical icons by filtering after load
        found.forEach((src, i) => {
            const tile = document.createElement('div');
            tile.className = 'favicon-tile' + (i === 0 ? ' selected' : '');
            if (i === 0) selectedFaviconUrl = src;

            const img = document.createElement('img');
            img.src = src;
            img.alt = '';

            const check = document.createElement('div');
            check.className = 'favicon-check';
            check.textContent = '✓';

            tile.appendChild(img);
            tile.appendChild(check);
            tile.title = src;

            tile.addEventListener('click', () => {
                picker.querySelectorAll('.favicon-tile').forEach(t => t.classList.remove('selected'));
                tile.classList.add('selected');
                selectedFaviconUrl = src;
            });

            picker.appendChild(tile);
        });
    }

    // ─── EMOJI PICKER ───────────────────────────────────────────────
    function buildEmojiPicker(pickerId, type) {
        const picker = document.getElementById(pickerId);
        picker.innerHTML = '';

        // Search bar
        const searchWrap = document.createElement('div');
        searchWrap.className = 'emoji-search-wrap';
        const searchInput = document.createElement('input');
        searchInput.type = 'text';
        searchInput.className = 'emoji-search';
        searchInput.placeholder = '🔍 Search emojis…';
        searchInput.autocomplete = 'off';
        searchWrap.appendChild(searchInput);
        picker.appendChild(searchWrap);

        // Categories container (inside scroll area)
        const scrollArea = document.createElement('div');
        scrollArea.className = 'emoji-scroll-area';
        picker.appendChild(scrollArea);

        const catContainer = document.createElement('div');
        catContainer.className = 'emoji-cats';
        scrollArea.appendChild(catContainer);

        // No-results message
        const noResults = document.createElement('div');
        noResults.className = 'emoji-no-results';
        noResults.textContent = 'No emojis found';
        noResults.style.display = 'none';
        scrollArea.appendChild(noResults);

        function renderCategories(filter) {
            catContainer.innerHTML = '';
            let totalShown = 0;
            EMOJI_CATEGORIES.forEach(cat => {
                const matches = filter
                    ? cat.emojis.filter(e => {
                        const name = emojiName(e).toLowerCase();
                        return name.includes(filter) || e === filter;
                    })
                    : cat.emojis;
                if (!matches.length) return;
                totalShown += matches.length;

                const catEl = document.createElement('div');
                catEl.className = 'emoji-category';

                const label = document.createElement('div');
                label.className = 'emoji-category-label';
                label.textContent = cat.label;
                catEl.appendChild(label);

                const grid = document.createElement('div');
                grid.className = 'emoji-grid';
                matches.forEach(e => {
                    const span = document.createElement('span');
                    span.className = 'emoji-opt';
                    span.textContent = e;
                    span.title = emojiName(e);
                    span.onclick = () => selectEmoji(type, e);
                    grid.appendChild(span);
                });
                catEl.appendChild(grid);
                catContainer.appendChild(catEl);
            });
            noResults.style.display = totalShown === 0 ? 'block' : 'none';
        }

        renderCategories('');

        searchInput.addEventListener('input', () => {
            renderCategories(searchInput.value.trim().toLowerCase());
        });

        // Clear search when picker opens
        picker._clearSearch = () => {
            searchInput.value = '';
            renderCategories('');
            const sa = picker.querySelector('.emoji-scroll-area');
            if (sa) sa.scrollTop = 0;
        };
    }

    function emojiName(e) {
        return EMOJI_KEYWORDS[e] || e;
    }

    function initEmojiPickers() {
        buildEmojiPicker('dialEmojiPicker', 'dial');
        buildEmojiPicker('groupEmojiPicker', 'group');
        buildEmojiPicker('tabEmojiPicker', 'tab');
    }

    function toggleEmojiPicker(type) {
        const picker = document.getElementById(type + 'EmojiPicker');
        const isOpen = picker.classList.contains('open');
        // Close all pickers first
        document.querySelectorAll('.emoji-picker').forEach(p => p.classList.remove('open'));
        if (!isOpen) {
            picker.classList.add('open');
            if (picker._clearSearch) picker._clearSearch();
            // Focus search input
            const si = picker.querySelector('.emoji-search');
            if (si) setTimeout(() => si.focus(), 50);
        }
    }

    function selectEmoji(type, emoji) {
        if (type === 'dial') {
            currentDialEmoji = emoji;
            document.getElementById('dialEmojiPreview').textContent = emoji;
        } else if (type === 'tab') {
            currentTabEmoji = emoji;
            document.getElementById('tabEmojiPreview').textContent = emoji;
        } else {
            currentGroupEmoji = emoji;
            document.getElementById('groupEmojiPreview').textContent = emoji;
        }
        document.getElementById(type + 'EmojiPicker').classList.remove('open');
    }

    function randomEmoji(type) {
        const list = (type === 'group' || type === 'tab') ? GROUP_EMOJIS : EMOJI_LIST;
        const emoji = pickRandomEmoji(list);
        if (type === 'dial') {
            currentDialEmoji = emoji;
            document.getElementById('dialEmojiPreview').textContent = emoji;
        } else if (type === 'tab') {
            currentTabEmoji = emoji;
            document.getElementById('tabEmojiPreview').textContent = emoji;
        } else {
            currentGroupEmoji = emoji;
            document.getElementById('groupEmojiPreview').textContent = emoji;
        }
    }

    // ─── MODAL HELPERS ──────────────────────────────────────────────
    function openModal(id) {
        document.getElementById(id).classList.add('open');
    }

    function closeModal(id) {
        document.getElementById(id).classList.remove('open');
    }

    // Click backdrop to close
    document.querySelectorAll('.modal-backdrop').forEach(bd => {
        bd.addEventListener('click', e => { if (e.target === bd) bd.classList.remove('open'); });
    });

    // ─── IMPORT / EXPORT ────────────────────────────────────────────
    function exportData() {
        const json = JSON.stringify(data, null, 2);
        const blob = new Blob([json], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'speed-dial.json';
        a.click();
        showToast('✅ Exported speed-dial.json');
    }

    function openImportModal() {
        document.getElementById('importData').value = '';
        openModal('importModal');
    }

    function importData() {
        try {
            const raw = document.getElementById('importData').value.trim();
            const imported = JSON.parse(raw);
            // Support both old { groups } and new { tabs } format
            if (imported.groups && !imported.tabs) {
                imported = { tabs: [{ id: uid(), name: 'Home', groups: imported.groups }] };
            }
            if (!imported.tabs || !Array.isArray(imported.tabs)) throw new Error('Invalid format');
            data = imported;
            saveData();
            render();
            closeModal('importModal');
            showToast('✅ Imported successfully');
        } catch(e) {
            showToast('❌ Invalid JSON format');
        }
    }

    // ─── KEYBOARD SHORTCUTS ─────────────────────────────────────────
    document.addEventListener('keydown', e => {
        if (e.key === 'Escape') {
            document.querySelectorAll('.modal-backdrop.open').forEach(m => m.classList.remove('open'));
        }
    });

    // ─── INIT ───────────────────────────────────────────────────────
    loadData();
    initEmojiPickers();
    render();
</script>
