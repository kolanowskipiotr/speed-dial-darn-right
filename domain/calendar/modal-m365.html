<div class="modal-backdrop" id="m365ConfigModal">
    <div class="modal" style="max-width: 640px;">
        <div class="modal-title">M365 Calendar Configuration</div>

        <div class="form-group">
            <label class="form-label form-label-row" style="cursor: pointer;">
                Enable header widget
                <div class="edit-toggle" id="m365EnabledToggle" onclick="toggleM365CalendarEnabled()">
                    <div class="toggle-track">
                        <div class="toggle-thumb"></div>
                    </div>
                </div>
            </label>
        </div>

        <div class="form-group">
            <label class="form-label" for="m365IcsUrlInput">ICS URL</label>
            <input type="url" id="m365IcsUrlInput" class="form-input" placeholder="https://outlook.office365.com/owa/calendar/.../calendar.ics">
            <div style="font-size: 11px; color: var(--text-dimmer); margin-top: 6px;">
                This is the only calendar source used by the widget.
            </div>
        </div>

        <div class="form-group">
            <label class="form-label" for="m365TimezoneInput">Timezone override (optional)</label>
            <input type="text" id="m365TimezoneInput" class="form-input" placeholder="e.g. Europe/Warsaw" list="m365TimezoneList" autocomplete="off">
            <datalist id="m365TimezoneList"></datalist>
            <div style="font-size: 11px; color: var(--text-dimmer); margin-top: 6px;">
                Start typing to filter timezones. Leave empty to use the browser's local timezone.
            </div>
        </div>

        <div id="m365CfgStatus" class="sync-status" style="text-align: left;"></div>

        <div class="modal-actions">
            <button class="btn-secondary" onclick="closeModal('m365ConfigModal')">Cancel</button>
            <button class="btn-primary" id="m365SaveBtn">Save</button>
        </div>
    </div>
</div>

<div class="modal-backdrop m365-details-backdrop" id="m365DetailsPopover">
    <div class="modal m365-details-modal" role="dialog" aria-modal="true" aria-labelledby="m365DetailsTitle">
        <div class="m365-details-modal-head">
            <div class="modal-title" id="m365DetailsTitle">Meeting details</div>
            <div class="m365-details-head-actions" id="m365DetailsHeadActions"></div>
        </div>
        <div class="m365-details-modal-body" id="m365DetailsBody"></div>
        <div class="m365-details-modal-actions">
            <button type="button" class="btn-secondary m365-details-close" id="m365DetailsCloseBtn">Close</button>
        </div>
    </div>
</div>
