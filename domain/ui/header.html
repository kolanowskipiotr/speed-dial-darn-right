<header>
    <div class="header-top">
        <div class="header-left">
            <div class="logo" id="logoText">⚡ Speed Dial Darn Right</div>
            <div class="header-tagline" id="headerDialCount"></div>
        </div>
        <div class="header-center">
            <div class="header-m365-col">
                <button class="m365-compact" id="m365Compact" type="button" aria-label="Open calendar agenda">
                    <span class="m365-label">Next</span>
                    <span class="m365-empty">No meeting</span>
                </button>
                <div class="m365-popover" id="m365AgendaPopover">
                    <div class="m365-popover-head">Agenda (5 working days)</div>
                    <div class="m365-popover-body" id="m365AgendaBody"></div>
                </div>
                <div class="m365-popover m365-details" id="m365DetailsPopover">
                    <div class="m365-popover-head">Meeting details</div>
                    <div class="m365-popover-body" id="m365DetailsBody"></div>
                </div>
            </div>
            <div class="header-time-col">
                <div class="header-clock" id="headerClock"></div>
                <div class="header-date-row" id="headerDateRow">
                    <span class="header-date" id="headerDate"></span>
                </div>
            </div>
            <div class="header-weather-col">
                <div id="headerWeatherInline" class="header-weather-inline" role="button" tabindex="0" aria-label="Open detailed weather"></div>
            </div>
        </div>
        <div class="header-actions">
            <div class="header-search-wrap" id="headerSearchWrap">
                <input type="search" id="searchInput" class="header-search-input" placeholder="🔍 Search dials…"
                       autocomplete="off">
                <div class="search-dropdown" id="searchDropdown" style="display:none"></div>
            </div>
            <div class="gdrive-indicators">
                <span class="gdrive-state-label">State</span>
                <div class="gdrive-dots-row">
                    <button class="gdrive-indicator" id="gdriveIndicator"           onclick="openDataModal()" data-label="Google Drive: not connected" aria-label="Google Drive connection"><span class="gdrive-dot"></span><span class="gdrive-abbr">GD</span></button>
                    <button class="gdrive-indicator" id="gdriveTokenIndicator"      onclick="openDataModal()" data-label="Token: no session"           aria-label="Token freshness"><span class="gdrive-dot"></span><span class="gdrive-abbr">TV</span></button>
                    <button class="gdrive-indicator" id="gdriveAutoSyncIndicator"   onclick="openDataModal()" data-label="Daily auto-backup: off"      aria-label="Daily auto-backup status"><span class="gdrive-dot"></span><span class="gdrive-abbr">DB</span></button>
                    <button class="gdrive-indicator" id="gdriveDisconnectIndicator" onclick="openDataModal()" data-label="Manage on disconnect: off"   aria-label="Manage on disconnect status"><span class="gdrive-dot"></span><span class="gdrive-abbr">MD</span></button>
                    <button class="gdrive-indicator" id="gdriveNotesSyncIndicator"  onclick="openDataModal()" data-label="Notes Tasks sync: off"        aria-label="Notes Tasks sync status"><span class="gdrive-dot"></span><span class="gdrive-abbr">NT</span></button>
                </div>
            </div>
            <div class="edit-toggle" id="editToggle" onclick="toggleEditMode()">
                <span class="edit-toggle-label" id="editLabel">Edit</span>
                <div class="toggle-track">
                    <div class="toggle-thumb"></div>
                </div>
            </div>
        </div>
    </div>
    <!-- Edit-mode toolbar — second row, only visible in edit mode -->
    <div class="header-edit-bar">
        <div class="tab-size-control" id="tabSizeControl">
            <div class="form-label" style="margin:0 0 6px">Dial Size <span class="size-value" id="tabSizeValue">140px</span></div>
            <div class="size-slider-wrap">
                <div class="size-slider-row">
                    <span style="font-size:14px">🔲</span>
                    <input type="range" class="size-slider tab-size-slider" id="tabSizeSlider"
                           min="60" max="400" step="10" value="140"
                           list="sizePresets"
                           oninput="setTabDialSize(+this.value)">
                    <datalist id="sizePresets">
                        <option value="80"></option>
                        <option value="120"></option>
                        <option value="160"></option>
                        <option value="220"></option>
                        <option value="320"></option>
                    </datalist>
                    <span style="font-size:22px">🔲</span>
                </div>
                <div class="size-labels">
                    <span class="size-preset" data-size="80">Tiny</span>
                    <span class="size-preset" data-size="120">Small</span>
                    <span class="size-preset" data-size="160">Medium</span>
                    <span class="size-preset" data-size="220">Large</span>
                    <span class="size-preset" data-size="320">Huge</span>
                </div>
            </div>
        </div>
        <div class="theme-sep"></div>
        <div class="theme-selector" id="themeSelector"></div>
        <div class="theme-sep"></div>
        <div class="anim-toggle" id="animToggle" onclick="toggleLogoAnim()">
            <span class="anim-toggle-label" id="animLabel">⚡ Animation</span>
            <div class="toggle-track">
                <div class="toggle-thumb"></div>
            </div>
        </div>
        <div class="theme-sep"></div>
        <button class="btn-secondary" onclick="openWeatherConfigModal()">Weather Config</button>
        <button class="btn-secondary" onclick="openM365ConfigModal()">M365 Config</button>
        <button class="btn-primary" style="margin-left: 10px;" onclick="openDataModal()">Manage Data</button>
    </div>
    <div class="tabs-bar" id="tabsBar"></div>
</header>
