name: speed-dial-darn-right

services:

  uploader:
    build:
      context: uploader
    container_name: speed-dial-uploader
    restart: unless-stopped
    volumes:
      - speed_dial_uploads:/uploads

  speed-dial:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: speed-dial
    restart: unless-stopped
    ports:
      - "${PORT:-8998}:80"       # http://localhost:8998  (override with PORT=9090)

    volumes:
      # ── Persistent data storage ──────────────────────────────────
      - speed_dial_data:/data
      - speed_dial_uploads:/uploads

    environment:
      - TZ=${TZ:-Europe/Warsaw}   # Set your timezone

    labels:
      com.speed-dial.description: "Speed Dial Darn Right - home page"
      com.speed-dial.version: "1.0"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# ── Named volumes ────────────────────────────────────────────────
# Docker manages these on the host under /var/lib/docker/volumes/
# To back them up:  docker run --rm -v speed_dial_data:/data -v $(pwd):/backup alpine tar czf /backup/data.tar.gz /data
volumes:
  speed_dial_data:
    driver: local
  speed_dial_uploads:
    driver: local
